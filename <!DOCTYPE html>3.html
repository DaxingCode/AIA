<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好记AI 启动屏预览</title>
<style>
  :root {
    --surface: #f7f9fb;
    --reading: #3c3c43;
    --muted: #8a9099;
    --blue: #378add;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    background: #eef1f4;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
  }
  h1 {
    font-size: 15px;
    color: var(--reading);
    margin-bottom: 24px;
    font-weight: 600;
  }
  .device {
    width: 390px;
    height: 844px;
    background: var(--surface);
    border-radius: 54px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.16);
    position: relative;
    overflow: hidden;
    border: 10px solid #1c1c1e;
  }
  .screen {
    width: 100%;
    height: 100%;
    position: relative;
  }
  .center-group {
    position: absolute;
    top: 38%;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform: translateY(-50%);
  }
  .icon {
    width: 76px;
    height: 76px;
    border-radius: 22px;
    box-shadow: 0 4px 16px rgba(55,138,221,0.24);
    background: transparent;
    object-fit: cover;
  }
  .title {
    margin-top: 18px;
    font-size: 20px;
    font-weight: 700;
    color: var(--reading);
    letter-spacing: -0.3px;
  }
  .footer {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 80px;            /* 副标题再下移：120 → 80 */
    text-align: center;
    font-size: 14px;
    color: var(--muted);
    padding: 0 32px;
  }
  .note {
    margin-top: 24px;
    font-size: 13px;
    color: var(--muted);
    max-width: 360px;
    text-align: center;
    line-height: 1.6;
  }
  .note code {
    background: rgba(55,138,221,0.10);
    color: var(--blue);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
  }
</style>
</head>
<body>
  <h1>好记AI · 系统启动屏（Launch Screen）预览</h1>
  <div class="device">
    <div class="screen">
      <div class="center-group">
        <img class="icon" src="AIA/AIA/Assets.xcassets/AppIcon.appiconset/AppIcon.png" alt="App Icon">
        <div class="title">好记AI</div>
      </div>
      <div class="footer">自动记账记待办，管理饮食和健康</div>
    </div>
  </div>
  <div class="note">
    该 HTML 引用工程里的 <code>AppIcon.png</code>，请把本文件放在 <code>/Volumes/MacBook/Workbuddy/AI助理/</code> 工作区根目录下再打开，图标才能正常显示。<br><br>
    副标题 bottom 120 → 80px，更靠近底部。
  </div>
</body>
</html>
