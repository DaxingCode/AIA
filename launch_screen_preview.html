<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>启动屏预览 · 好记AI</title>
<style>
  :root{
    --surface:#f7f9fb;
    --reading:#3c3c43;
    --muted:#8a9099;
  }
  html,body{margin:0;height:100%;background:#222;display:flex;align-items:center;justify-content:center;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;}
  .device{position:relative;width:390px;height:844px;background:var(--surface);border-radius:54px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .center-group{position:absolute;top:38%;left:0;right:0;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;}
  .icon{width:76px;height:76px;border-radius:22px;box-shadow:0 4px 16px rgba(55,138,221,.24);background:#fff;}
  .title{margin-top:18px;font-size:20px;font-weight:600;color:var(--reading);letter-spacing:.5px;}
  .footer{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:14px;color:var(--muted);}
</style>
</head>
<body>
  <div class="device">
    <div class="center-group">
      <img class="icon" src="AIA/AIA/Assets.xcassets/AppIcon.appiconset/AppIcon.png" alt="AppIcon">
      <div class="title">好记AI</div>
    </div>
    <div class="footer">自动记账记待办，管理饮食和健康</div>
  </div>
</body>
</html>
